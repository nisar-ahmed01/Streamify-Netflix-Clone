spring.application.name = com.netflix.clone

#Think of it as the "control panel" or "settings menu" for your backend.
# Instead of hardcoding values (like database passwords, server ports, or email addresses)
# directly into your Java code, you put them in this file.


#Database Configuration (MySQL)

#use to talk to mysql
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

#address of database
spring.datasource.url = jdbc:mysql://localhost:3306/streamify_video

spring.datasource.username = root
spring.datasource.password = 12345

#print the SQL query in your IntelliJ console
spring.jpa.show-sql = true

#Create or update the MySQL tables for you. You don't have to manually write CREATE TABLE SQL scripts.
spring.jpa.hibernate.ddl-auto = update

#version
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

#Makes the SQL printed in the console look neat and readable
spring.jpa.properties.hibernate.format_sql = true



#Video/Image Uploads (MultipartFile)

#Turns on the ability to handle file uploads.
spring.servlet.multipart.enabled = true

#Spring Boot Default 1MB
spring.servlet.multipart.max-file-size = 2GB
spring.servlet.multipart.max-request-size = 2GB


#These are Tomcat (your embedded server) specific settings. The -1 means "unlimited".
# If a user uploads a file that is bigger than the max size, Tomcat normally crashes the connection.
# Setting this to -1 allows Tomcat to swallow (read) the whole request before rejecting it,
# preventing ugly server errors during big video uploads.
server.tomcat.max-swallow-size = -1
server.tomcat.max-http-form-post-size = -1


#Custom Variables
file.upload.video-dir = uploads/videos
file.upload.image-dir = uploads/images


#Email Configuration (JavaMailSender)

#Tells Spring to use Gmail's SMTP server to send emails. using google gmail server. stmp is a language use to send emails
spring.mail.host = smtp.gmail.com
spring.mail.port = 587

#user crendentials
spring.mail.username = nisarahmed@gmail.com
spring.mail.password = random

#Tells the server that you need to authenticate (log in) before sending an email.
spring.mail.properties.mail.smtp.auth = true

#Upgrades the connection to a secure, encrypted connection (TLS). This is a security requirement for almost all modern email providers.
spring.mail.properties.mail.smtp.starttls.enable = true
spring.mail.properties.mail.smtp.starttls.required = true

#If the email server takes longer than 5000 milliseconds (5 seconds) to connect, read, or write, stop trying and throw an error.
spring.mail.properties.mail.smtp.connectiontimeout = 5000
#(read)
spring.mail.properties.mail.smtp.timeout = 5000
spring.mail.properties.mail.smtp.writetimeout = 5000


# for angular port
app.frontend.url = http://localhost:4200



